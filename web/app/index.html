<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工单看板</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <h1>工单看板</h1>
      <div class="tools">
        <input id="q" type="search" placeholder="搜标题…" />
        <label class="chk"><input id="readyOnly" type="checkbox" /> 只看可派给 AI</label>
        <button id="refresh" type="button">刷新</button>
        <button id="new" type="button" class="primary">新建工单</button>
      </div>
      <div id="hint" class="hint"></div>
      <div class="legend">
        <b>待接</b> 可以派给 AI（<code>node wf.mjs work</code>）<span class="dot">·</span>
        <b>执行中</b> AI 在改<span class="dot">·</span>
        <b>待审</b> 改完了，等验收<span class="dot">·</span>
        <b>已完成</b> 已提交并关闭。点开任意卡片看全链路。
      </div>
    </header>

    <main id="board" class="board"></main>

    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <span id="panelId" class="mono"></span>
        <button id="panelClose" type="button" class="ghost">关闭</button>
      </div>
      <h2 id="panelTitle"></h2>
      <div id="panelMeta" class="meta"></div>
      <div class="row">
        <label>状态 <select id="panelStatus"></select></label>
        <label>优先级 <input id="panelPriority" type="number" min="0" max="4" /></label>
      </div>
      <div class="row">
        <input id="panelLabel" placeholder="加标签，逗号分隔" />
        <button id="panelLabelAdd" type="button">加</button>
      </div>
      <pre id="panelBody" class="body"></pre>
      <h3>追溯</h3>
      <div id="panelTrace" class="trace"></div>
      <h3>评论</h3>
      <div id="panelComments" class="comments"></div>
      <textarea id="panelComment" rows="3" placeholder="写评论（cmd/ctrl+enter 发送）"></textarea>
      <button id="panelCommentSend" type="button" class="primary">发送</button>
    </aside>

    <dialog id="create" class="dialog">
      <form id="createForm" method="dialog">
        <h2>新建工单</h2>
        <label>标题<input name="title" required maxlength="200" /></label>
        <label>描述<textarea name="description" rows="8"></textarea></label>
        <div class="row">
          <label>类型
            <select name="type">
              <option value="task">task</option>
              <option value="feature">feature</option>
              <option value="bug">bug</option>
              <option value="chore">chore</option>
            </select>
          </label>
          <label>优先级
            <select name="priority">
              <option value="2" selected>P2</option>
              <option value="1">P1</option>
              <option value="0">P0</option>
              <option value="3">P3</option>
              <option value="4">P4</option>
            </select>
          </label>
        </div>
        <label>标签（逗号分隔）<input name="labels" placeholder="ready-for-agent" /></label>
        <menu>
          <button type="button" class="ghost" id="createCancel">取消</button>
          <button type="submit" class="primary">创建</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/app.js"></script>
  </body>
</html>
